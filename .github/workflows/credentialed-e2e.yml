name: Veritas test-project browser journeys

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journeys:
    runs-on: ubuntu-latest
    environment: veritas-e2e-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:credentialed
        env:
          CI: true
          VERITAS_E2E_CREDENTIALS: "true"
          VERITAS_E2E_TEST_PROJECT: "true"
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: http://127.0.0.1:4173
          VERITAS_E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
          VERITAS_E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
          VERITAS_E2E_COACH_EMAIL: ${{ secrets.E2E_COACH_EMAIL }}
          VERITAS_E2E_COACH_PASSWORD: ${{ secrets.E2E_COACH_PASSWORD }}
